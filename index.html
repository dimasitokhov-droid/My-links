
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<meta name="description" content="Социальные сети и последние обновления Dimonix_Rick">
<title>Dimonix_Rick — мои страницы</title>
<style>
:root{color-scheme:dark;--bg:#101116;--surface:#191a22;--surface2:#22232d;--line:#30313d;--text:#f2eff8;--muted:#aaa7b6;--primary:#d0bcff;--primaryText:#241b35;--green:#9bd7b0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#35234b 0,transparent 48%),var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:34px 0 24px}
.hero{text-align:center;padding:20px 12px 28px}
.avatar{width:116px;height:116px;object-fit:cover;border-radius:34px;border:1px solid #ffffff20;box-shadow:0 12px 40px #0008}
h1{font-size:29px;letter-spacing:.2px;margin:16px 0 6px}
.subtitle{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:12px;margin-top:14px}
.dot{width:7px;height:7px;background:var(--green);border-radius:50%}
.section{margin:14px 0 26px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
h2{font-size:18px;margin:0;font-weight:650}
.hint{font-size:12px;color:var(--muted)}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.social{background:linear-gradient(145deg,#20212b,#171820);border:1px solid var(--line);border-radius:22px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:150px;transition:transform .18s,border-color .18s}
.social:hover{transform:translateY(-3px);border-color:#8270ad}
.social-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.social-icon img{width:100%;height:100%;object-fit:contain;display:block}
.max-icon{background:#29204a}
.x-icon{background:#000}
.margy-icon{background:linear-gradient(135deg,#6554d9,#258ee5);font-size:34px;font-weight:800;color:white}
.social strong{font-size:14px}
.social small{color:var(--muted);font-size:12px}
.events{display:grid;gap:12px}
.event{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;overflow:hidden}
.event img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:0 0 12px}
.event-date{font-size:12px;color:var(--primary);margin-bottom:7px}
.event h3{font-size:17px;margin:0 0 7px}
.event p{color:#c7c3d0;line-height:1.55;margin:0;white-space:pre-wrap}
.empty{border:1px dashed #494653;border-radius:18px;padding:24px;text-align:center;color:var(--muted);font-size:14px}
footer{text-align:center;color:#777482;font-size:12px;padding:20px 0 8px}
#version{display:inline-block;padding:8px 12px;border-radius:12px;cursor:default;user-select:none}
#version:active{background:#ffffff10}
.admin-open{display:none;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 14px;color:var(--text);font-weight:600;cursor:pointer}
.admin-open.show{display:inline-flex}
button{font:inherit}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.dialog{width:min(460px,100%);background:#1b1c25;border:1px solid #44414e;border-radius:24px;padding:20px;max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0009}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.dialog h2{font-size:20px}
.close{background:#2a2b35;border:0;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
label{display:block;color:#c9c5d1;font-size:13px;margin:13px 0 6px}
input,textarea{width:100%;border:1px solid #444451;background:#111219;color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:95px;resize:vertical}
.primary{width:100%;border:0;border-radius:13px;background:var(--primary);color:var(--primaryText);font-weight:750;padding:13px;margin-top:16px;cursor:pointer}
.secondary{border:1px solid var(--line);background:#282934;color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}
.danger{border:1px solid #75464e;background:#3a242a;color:#ffd9df;border-radius:12px;padding:9px 12px;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
.adminbar{display:none;gap:8px;align-items:center;justify-content:space-between;background:#252332;border:1px solid #514767;padding:12px;border-radius:16px;margin:0 0 18px}
.adminbar.show{display:flex}
.adminbar span{font-size:13px;color:#d6c8f5}
.event-admin{display:flex;gap:8px;margin-top:12px}
.event-admin button{font-size:12px}
@media(max-width:520px){
.wrap{width:min(100% - 22px,760px);padding-top:20px}
.socials{grid-template-columns:1fr}
.social{min-height:84px;flex-direction:row;text-align:left;justify-content:flex-start;padding:12px 14px}
.social-icon{width:54px;height:54px;border-radius:15px}
.social small{display:block;margin-top:4px}
.hero{padding-bottom:20px}
.avatar{width:104px;height:104px}
}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<img class="avatar" src="./avatar.jpg" alt="Аватарка Dimonix_Rick">
<h1>Dimonix_Rick</h1>
<div class="subtitle">Мои проекты, каналы и обновления</div>
<div class="pill"><span class="dot"></span> Официальные ссылки</div>
</header>

<div class="adminbar" id="adminBar">
<span>Режим разработчика включён</span>
<button class="secondary" id="addEventBtn">＋ Добавить событие</button>
<button class="secondary" id="logoutBtn">Выйти</button>
</div>

<section class="section">
<div class="section-head"><h2>Мои каналы</h2><span class="hint">Переход по нажатию</span></div>
<div class="socials">

<a class="social" href="https://max.ru/join/ltx-0Ti4ZAhtbkHqb95CRsR5qc2rDRRm9P_3T_6VXAY" target="_blank" rel="noopener noreferrer">
<div class="social-icon max-icon">
<img src="./Max_logo_2025.png" alt="MAX">
</div>
<span><strong>Chatly</strong><small>MAX</small></span>
</a>

<a class="social" href="https://x.com/Chatly_Original" target="_blank" rel="noopener noreferrer">
<div class="social-icon x-icon">
<img src="./1795278738441.jpg" alt="X">
</div>
<span><strong>Chatly</strong><small>X</small></span>
</a>

<a class="social" href="https://chat.narez.xyz/u/Chatly" target="_blank" rel="noopener noreferrer">
<div class="social-icon margy-icon" aria-hidden="true">M</div>
<span><strong>Margy Chat</strong><small>Мой чат</small></span>
</a>

</div>
</section>

<section class="section">
<div class="section-head"><h2>Последние события</h2><span class="hint">Мои новости</span></div>
<div class="events" id="eventsList"><div class="empty">Загружаем события…</div></div>
</section>

<footer>
<span id="version" title="Версия сайта">Version 1.0.0</span>
<div>© 2026 Dimonix_Rick</div>
</footer>
</main>

<div class="modal" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
<div class="dialog">
<div class="dialog-head"><h2 id="loginTitle">Вход разработчика</h2><button class="close" data-close="loginModal" aria-label="Закрыть">×</button></div>
<label for="email">Электронная почта</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com">
<label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="Твой пароль">
<button class="primary" id="loginBtn">Войти</button>
<div class="status" id="loginStatus"></div>
</div>
</div>

<div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
<div class="dialog">
<div class="dialog-head"><h2 id="eventTitle">Новое событие</h2><button class="close" data-close="eventModal" aria-label="Закрыть">×</button></div>
<form id="eventForm">
<input id="editId" type="hidden">
<label for="eventName">Название события</label><input id="eventName" maxlength="90" required placeholder="Например, обновление Chatly">
<label for="eventDate">Дата</label><input id="eventDate" type="date" required>
<label for="eventDescription">Описание</label><textarea id="eventDescription" maxlength="1200" required placeholder="Расскажи, что нового…"></textarea>
<label for="eventImage">Ссылка на фотографию (необязательно)</label><input id="eventImage" type="url" placeholder="https://example.com/photo.jpg">
<button class="primary" id="saveEventBtn" type="submit">Опубликовать событие</button>
<div class="status" id="eventStatus"></div>
</form>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCFV1lhi8urqhTY48B__uhPQvEj_sllL64",
authDomain: "dimonix-rick.firebaseapp.com",
projectId: "dimonix-rick",
storageBucket: "dimonix-rick.firebasestorage.app",
messagingSenderId: "1015417299916",
appId: "1:1015417299916:web:b4117ef3cf6dd73e69f369",
measurementId: "G-V1QG4BG340"
};

const ADMIN_UID = "dQRwJRpXOyYiGGXxKqasFkdaq053";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const loginModal = $("loginModal");
const eventModal = $("eventModal");
let isAdmin = false;
let unsubscribeEvents = null;

function showModal(el){el.classList.add("show")}
function hideModal(el){el.classList.remove("show")}

document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>hideModal($(b.dataset.close))));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)hideModal(m)}));

let taps=0,tapTimer;
$("version").addEventListener("click",()=>{
taps++;
clearTimeout(tapTimer);
tapTimer=setTimeout(()=>taps=0,1100);
if(taps>=3){taps=0;showModal(loginModal);$("email").focus()}
});

$("loginBtn").addEventListener("click",async()=>{
$("loginStatus").textContent="Проверяем данные…";
try{
await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
$("password").value="";
hideModal(loginModal);
$("loginStatus").textContent="";
}catch(err){
$("loginStatus").textContent="Не удалось войти. Проверь почту и пароль.";
}
});

$("logoutBtn").addEventListener("click",()=>signOut(auth));
$("addEventBtn").addEventListener("click",()=>openEventEditor());

onAuthStateChanged(auth,user=>{
isAdmin=!!user&&user.uid===ADMIN_UID;
$("adminBar").classList.toggle("show",isAdmin);
if(user&&!isAdmin)signOut(auth);
renderEventsFromFirestore();
});

function renderEventsFromFirestore(){
if(unsubscribeEvents)unsubscribeEvents();
const list=$("eventsList");
list.innerHTML='<div class="empty">Загружаем события…</div>';
const q=query(collection(db,"events"),orderBy("date","desc"));
unsubscribeEvents=onSnapshot(q,snapshot=>{
list.innerHTML="";
if(snapshot.empty){
list.innerHTML='<div class="empty">Пока событий нет. Первое событие можно добавить через панель разработчика.</div>';
return;
}
snapshot.forEach(snap=>{
const d=snap.data();
const article=document.createElement("article");
article.className="event";
const safeDate=String(d.date||"");
const date=document.createElement("div");
date.className="event-date";
date.textContent=safeDate;
const title=document.createElement("h3");
title.textContent=d.title||"Без названия";
const desc=document.createElement("p");
desc.textContent=d.description||"";
article.append(date,title,desc);
if(d.imageUrl&&/^https?:\/\//i.test(d.imageUrl)){
const img=document.createElement("img");
img.src=d.imageUrl;
img.alt=d.title||"Фотография события";
img.loading="lazy";
img.onerror=()=>img.remove();
article.insertBefore(img,date);
}
if(isAdmin){
const actions=document.createElement("div");
actions.className="event-admin";
const edit=document.createElement("button");
edit.className="secondary";
edit.textContent="Изменить";
edit.addEventListener("click",()=>openEventEditor(snap.id,d));
const del=document.createElement("button");
del.className="danger";
del.textContent="Удалить";
del.addEventListener("click",async()=>{
if(confirm("Удалить это событие?"))await deleteDoc(doc(db,"events",snap.id));
});
actions.append(edit,del);
article.append(actions);
}
list.append(article);
});
},error=>{
list.innerHTML='<div class="empty">Не удалось загрузить события. Проверь правила Firestore и подключение к интернету.</div>';
console.error(error);
});
}

function openEventEditor(id="",data={}){
$("eventForm").reset();
$("editId").value=id;
$("eventTitle").textContent=id?"Изменить событие":"Новое событие";
$("saveEventBtn").textContent=id?"Сохранить изменения":"Опубликовать событие";
$("eventName").value=data.title||"";
$("eventDate").value=data.date||new Date().toISOString().slice(0,10);
$("eventDescription").value=data.description||"";
$("eventImage").value=data.imageUrl||"";
$("eventStatus").textContent="";
showModal(eventModal);
}

$("eventForm").addEventListener("submit",async e=>{
e.preventDefault();
if(!isAdmin){$("eventStatus").textContent="Нет прав администратора.";return}
const imageUrl=$("eventImage").value.trim();
if(imageUrl&&!/^https?:\/\//i.test(imageUrl)){
$("eventStatus").textContent="Ссылка на фото должна начинаться с https:// или http://";
return;
}
const data={
title:$("eventName").value.trim(),
date:$("eventDate").value,
description:$("eventDescription").value.trim(),
imageUrl,
updatedAt:serverTimestamp()
};
if(!data.title||!data.date||!data.description)return;
$("saveEventBtn").disabled=true;
$("eventStatus").textContent="Сохраняем…";
try{
const id=$("editId").value;
if(id)await updateDoc(doc(db,"events",id),data);
else await addDoc(collection(db,"events"),{...data,createdAt:serverTimestamp()});
hideModal(eventModal);
}catch(err){
$("eventStatus").textContent="Не удалось сохранить. Проверь интернет и правила Firestore.";
console.error(err);
}finally{
$("saveEventBtn").disabled=false;
}
});
</script>
</body>
</html>
